name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight deploy, but never cancels one that is
  # already applying migrations.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 used elsewhere: wrangler 4.x refuses to run on
          # anything older.
          node-version: 22
          cache: npm

      - run: npm ci

      # The sheet-parity guard lives here. A regression in the fan metric
      # should stop the deploy, not reach members.
      - run: npm test

      - run: npm run typecheck

      - run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply umaparty --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
